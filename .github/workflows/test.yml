name: Deploy Worker Script

on:
  push:
    tags:
      - '*'  # 当任何标签被推送时触发

jobs:
  deploy-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Get tag name
        id: get_tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "当前标签: $TAG_NAME"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整的Git历史来获取标签信息

      - name: Check if source file exists
        run: |
          if [ ! -f "_worker.js" ]; then
            echo "错误：在项目根目录未找到 '_worker.js' 文件。"
            exit 1
          fi
          echo "成功找到源文件 '_worker.js'"

      - name: Create zip file
        run: |
          zip Pages.zip _worker.js
          echo "成功将 '_worker.js' 压缩为 'Pages.zip'"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag_name }}
          name: Worker Release ${{ steps.get_tag.outputs.tag_name }}
          body: |
            ## 部署信息
            
            - **源文件**: _worker.js
            - **压缩文件**: Pages.zip
            - **标签**: ${{ steps.get_tag.outputs.tag_name }}
            - **部署时间**: $(date '+%Y-%m-%d %H:%M:%S')
            
            ## 文件变更
            
            已将 `_worker.js` 压缩为 `Pages.zip`。
            
            ## 附加说明
            此 Release 包含 Worker 脚本的部署包。请下载 Pages.zip 并解压使用。
          draft: false
          prerelease: false
          files: Pages.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output summary
        run: |
          echo "## 部署完成" >> $GITHUB_STEP_SUMMARY
          echo "- 源文件: _worker.js" >> $GITHUB_STEP_SUMMARY
          echo "- 压缩文件: Pages.zip" >> $GITHUB_STEP_SUMMARY
          echo "- 标签: ${{ steps.get_tag.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Release 已创建" >> $GITHUB_STEP_SUMMARY

      - name: Clean up temporary files
        if: always()
        run: |
          rm -f Pages.zip  # 清理临时文件
